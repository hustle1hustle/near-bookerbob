<!doctype html>
<!-- The video and post thumbnail, 1600 x 900. Rendered to docs/img/thumb.png with headless Chrome:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
         --window-size=1600,900 --screenshot=docs/img/thumb.png docs/img/thumb.html
     The numbers are the ones agents/swarm.html shows, from the recorded data: 8 bids in round
     b30-hotel-lisbon and its 408.00 winner (fixtures/live/testnet-manifest.json, blind_round),
     the 510.00 public rate of that merchant (agents/board.json), the 367.20 group tier and the
     group of 5 (manifest, group_dao). Change them here if the data changes. -->
<html lang="en">
<meta charset="utf-8">
<title>BookerBob thumbnail</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; }
  body { background: #0A0A0F; color: #E6E6EF; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; display: grid; grid-template-columns: 1fr 470px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .left { padding: 84px 0 76px 96px; display: flex; flex-direction: column; }
  .mark { font-size: 30px; font-weight: 600; }
  h1 { font-size: 112px; line-height: 1.0; letter-spacing: -0.045em; font-weight: 600; margin: auto 0 0; }
  .sub { font-size: 34px; line-height: 1.35; color: #B9B9CC; margin: 38px 0 0; max-width: 900px; letter-spacing: -0.01em; }
  .sub b { color: #FF4D5E; font-weight: 500; }
  .foot { margin-top: 54px; font-size: 22px; color: #7C7C94; display: flex; gap: 34px; }
  .right { border-left: 1px solid #1C1C2A; background: #10101A; padding: 84px 56px 76px 60px; display: flex; flex-direction: column; }
  .track { position: relative; flex: 1; border-left: 2px solid #3A3A4E; margin-left: 8px; }
  .rung { position: absolute; left: 0; padding-left: 40px; transform: translateY(-50%); }
  .rung::before { content: ""; position: absolute; left: -9px; top: 50%; width: 16px; height: 2px; background: #3A3A4E; }
  .rung .n { font-size: 54px; font-weight: 400; letter-spacing: -0.04em; color: #7C7C94; line-height: 1.05; }
  .rung .l { font-size: 21px; color: #7C7C94; margin-top: 6px; }
  .rung.pub .n { text-decoration: line-through; text-decoration-thickness: 2px; }
  .rung.now .n { font-size: 82px; font-weight: 600; color: #fff; }
  .rung.now .l { color: #3B5BFF; }
  .rung.now::before { left: -13px; width: 24px; height: 24px; border-radius: 50%; background: #3B5BFF; top: 42%; box-shadow: 0 0 0 9px rgba(59, 91, 255, 0.16); }
</style>
<body>
  <div class="left">
    <div class="mark mono">bookerbob</div>
    <h1>send your agent.<br>8 agents bid sealed.<br>you stay unknown.</h1>
    <p class="sub">a referee <b>refuses the cheats</b>, code sets the price, and a group of 5 strangers unlocks a lower one.</p>
    <div class="foot mono"><span>built at NEAR HACKATHON</span><span>a testnet replay, synthetic facts</span></div>
  </div>
  <div class="right mono">
    <div class="track">
      <div class="rung pub" style="top: 7%"><div class="n">510.00</div><div class="l">the public rate</div></div>
      <div class="rung" style="top: 56%"><div class="n">408.00</div><div class="l">3 proven bits</div></div>
      <div class="rung now" style="top: 87%"><div class="n">367.20</div><div class="l">in a group of 5</div></div>
    </div>
  </div>
</body>
</html>
