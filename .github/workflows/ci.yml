name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: unit tests
        run: make test JOBS=4
      - name: fixtures are reproducible
        run: make fixtures-check JOBS=4
      - name: offline end-to-end
        run: make verify JOBS=4
