name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: format
        # contract/src/lib.rs stays byte for byte as deployed: its panic locations carry line
        # numbers, so reformatting it changes the wasm and breaks make wasm-parity. It is
        # formatted with the next deploy; every other file must be formatted.
        run: |
          # standing-v2/src/lib.rs is compiled into the v2 Jolt guest whose program hash (62bf56eb) was set
          # on chain: reformatting moves its panic locations and changes that hash, so it stays as built.
          left=$(cargo fmt --all -- --check -l | grep -v -e '/contract/src/lib.rs$' -e '/standing-v2/src/lib.rs$' || true)
          if [ -n "$left" ]; then echo "not formatted:"; echo "$left"; cargo fmt --all -- --check; exit 1; fi
      - name: clippy
        # standing-v2/src/lib.rs is hashed into the pre-registered v3 and v4 results (e8c43d02) and built
        # into the v2 guest, so it stays as run: its library is linted, its test target is not.
        run: |
          cargo clippy --workspace --exclude bookerbob-standing-v2 --all-targets -j 4 -- -D warnings
          cargo clippy -p bookerbob-standing-v2 --lib -j 4 -- -D warnings
      - name: unit tests
        run: make test JOBS=4
      - name: fixtures are reproducible
        run: make fixtures-check JOBS=4
      - name: offline end-to-end
        run: make verify JOBS=4
  judge:
    # make judge on Linux x86_64: Node only, offline, the committed Linux Jolt verifier.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: make judge
        run: make judge
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: coverage (core, contract, worker, cli)
        run: |
          cargo llvm-cov --workspace -j 4 --summary-only | tee coverage.txt
          { echo '## Rust line coverage'; echo; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
