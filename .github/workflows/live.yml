# Recheck of the live testnet claims, twice a day (GitHub can skip a scheduled slot; the
# second one is the insurance): `make verify-live` re-derives every claim in
# fixtures/live/testnet-manifest.json over public RPC. It needs no keys and writes nothing.
# A red run here means a live claim no longer holds or public RPC was down; the log says which.
# Old txs are read from a public archival RPC that rate-limits, so a run can take many minutes.
name: live

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "47 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make verify-live
  mainnet-check:
    # The four mainnet records (docs/mainnet.md), re-read over public mainnet RPC, no keys.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make mainnet-check
