<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookerBob board</title>
<style>
  :root {
    --bg: #0A0A0F; --panel: #10101A; --fg: #E6E6EF; --dim: #7C7C94; --faint: #3A3A4E;
    --line: #1C1C2A; --blue: #3B5BFF; --blue-soft: rgba(59, 91, 255, 0.14);
    --red: #FF4D5E; --red-soft: rgba(255, 77, 94, 0.12); --green: #5BE3A0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { max-width: 1200px; margin: 0 auto; padding: 28px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  .tag { color: var(--dim); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .panel h2 { font-size: 12px; font-weight: normal; color: var(--dim); text-transform: lowercase; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { text-align: left; padding: 7px 14px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { color: var(--dim); font-weight: normal; font-size: 12px; }
  td.num, th.num { text-align: right; }
  td.lines { white-space: normal; color: var(--dim); font-size: 12px; }
  td .who { color: var(--fg); }
  td .bid { color: var(--faint); font-size: 11px; }
  td.agent { white-space: normal; max-width: 360px; }
  .pitch { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .more td { color: var(--faint); text-align: center; }
  tr.win td { background: var(--blue-soft); }
  tr.win td.rank { color: var(--blue); font-weight: 600; }
  tr.win td.price { color: #fff; font-weight: 600; }
  .group { color: var(--blue); }
  .buyer { padding: 18px 16px; }
  .slot { border: 1px dashed var(--faint); border-radius: 6px; padding: 18px 12px; text-align: center; color: var(--dim); margin-bottom: 14px; }
  .slot b { display: block; color: var(--fg); font-weight: 500; margin-bottom: 4px; }
  .k { font-size: 34px; color: var(--blue); font-weight: 600; line-height: 1.1; }
  .k small { display: block; font-size: 12px; color: var(--dim); font-weight: normal; }
  .counter { margin-top: 14px; padding: 12px; border-radius: 6px; background: var(--blue-soft); }
  .counter .big { font-size: 20px; color: #fff; }
  .kv { color: var(--dim); font-size: 12px; margin-top: 12px; word-break: break-all; }
  .receipts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
  @media (max-width: 860px) { .receipts { grid-template-columns: 1fr; } }
  .receipt { border-radius: 6px; padding: 14px 16px; border: 1px solid var(--line); background: var(--panel); }
  .receipt .head { display: flex; justify-content: space-between; margin-bottom: 10px; }
  .receipt.ok .state { color: var(--green); }
  .receipt.no { border-color: var(--red); background: var(--red-soft); }
  .receipt.no .state { color: var(--red); font-weight: 600; }
  .claim { font-size: 12px; color: var(--dim); padding: 3px 0; }
  .claim .cite { color: var(--fg); }
  .receipt.no .claim.bad, .receipt.no .claim.bad .cite { color: var(--red); }
  .verdict { margin-top: 10px; font-size: 13px; }
  .receipt.no .verdict { color: var(--red); }
  .asks { padding: 6px 16px 14px; }
  .ask { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .ask:last-child { border-bottom: none; }
  .ask .q { color: var(--fg); }
  .ask .a { color: var(--red); margin-top: 2px; }
  .bits { margin-top: 8px; font-size: 12px; color: var(--dim); }
  .bits div { display: flex; justify-content: space-between; }
  /* capture views: board.html#winner, #cheat, #asks */
  body.v-winner .receipts, body.v-winner aside, body.v-winner footer, body.v-cheat .grid, body.v-cheat footer, body.v-asks .grid > section, body.v-asks .receipts, body.v-asks footer, body.v-asks aside > .panel:first-child { display: none; }
  body.v-winner .grid { grid-template-columns: 1fr; }
  body.v-winner tr:nth-child(n+5) { display: none; }
  body.v-cheat .receipt.ok { display: none; }
  body.v-cheat .receipts { grid-template-columns: 1fr; }
  body.v-asks .grid { grid-template-columns: 1fr; }
  footer { color: var(--faint); font-size: 12px; margin-top: 24px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { background: none; border: 1px solid var(--line); color: var(--dim); font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 4px; cursor: pointer; }
  .tabs button.on { color: var(--fg); border-color: var(--blue); }
  .liveline { color: var(--dim); font-size: 12px; margin: -4px 0 14px; }
  .liveline.on::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #5BE3A0; margin-right: 8px; }
  .liveline a { color: inherit; }
  .chain { color: #5BE3A0; font-size: 11px; }
  body[class*="v-"] .liveline { display: none; }
</style>
</head>
<body>
<script>if (location.hash) document.body.classList.add("v-" + location.hash.slice(1));</script>
<main>
  <header>
    <h1>bookerbob</h1>
    <span class="tag">merchants compete for you. none of them learns who you are, until a delivery needs a name.</span>
  </header>
  <div class="liveline" id="liveline">reading bookerbob.testnet ...</div>
  <div class="grid">
    <section class="panel">
      <h2><span id="title">bids</span><span class="tabs" id="tabs"></span></h2>
      <div class="wrap"><table id="bids"></table></div>
    </section>
    <aside>
      <div class="panel">
        <h2><span>buyer</span><span>hidden</span></h2>
        <div class="buyer" id="buyer">loading board.json ...</div>
      </div>
      <div class="panel" style="margin-top:16px">
        <h2><span>merchant asks</span><span>answered by rule</span></h2>
        <div class="asks" id="asks"></div>
      </div>
      <div class="panel" style="margin-top:16px">
        <h2><span>sealed reviews</span><span>semaphore, k&gt;=5</span></h2>
        <div class="asks" id="reviews">loading reviews.json ...</div>
      </div>
    </aside>
  </div>
  <div class="receipts" id="receipts"></div>
  <footer id="foot"></footer>
</main>
<script src="live.js"></script>
<script>
const usd = (s) => "$" + (Number(BigInt(s) / 10000n) / 100).toFixed(2);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function load(p) { try { const r = await fetch(p); return r.ok ? r.json() : null; } catch { return null; } }

let BOARD = null;
let ONCHAIN = new Set();
let CURRENT = null;
function counter(category) {
  const d = (BOARD.disclosures ?? []).find((x) => x.category === category) ?? BOARD.disclosure;
  const el = document.getElementById("counter");
  if (!d || !el) return;
  el.innerHTML = `<div class="big">revealed ${d.revealed_bits} bits, saved ${usd(d.saved)}</div><div class="tag">${esc(d.category)}: ${usd(d.base_price)} base, pays ${usd(d.price)}${d.max_bits ? `, budget ${d.max_bits} bits` : ""}</div>
      ${(d.per_bit ?? []).length ? `<div class="bits">${d.per_bit.map((b) => `<div><span>${esc(b.predicate)}</span><span>${usd(b.saved)}</span></div>`).join("")}<div class="tag">what each bit saved against the best price without it</div></div>` : ""}`;
}
function bids(cat, pitches) {
  CURRENT = [cat, pitches];
  if (BOARD) counter(cat.category);
  document.getElementById("title").textContent = `bids, ${cat.category}, ${cat.rows.length} agents`;
  document.getElementById("bids").innerHTML =
    `<tr><th>#</th><th>merchant agent</th><th class="num">base</th><th class="num">disc</th><th class="num">price</th><th>discount lines (code)</th></tr>` +
    cat.rows.slice(0, 10).map((r) => `<tr class="${r.rank === 1 ? "win" : ""}">
      <td class="rank">${r.rank}</td>
      <td class="agent"><span class="who">${esc(r.merchant.split(".")[0])}</span>${ONCHAIN.has(r.merchant) ? ' <span class="chain" title="registered and approved on bookerbob.testnet">on chain</span>' : ""} <span class="bid">bid ${esc(r.bid_commitment.slice(0, 12))}</span> <span class="bid">${esc(r.operator)}, ${esc(r.base)}</span><div class="pitch">${esc((r.source === "config" && pitches[r.merchant]) || r.persona)}</div>${r.perks?.length ? `<div class="pitch">perks: ${esc(r.perks.join(", "))}</div>` : ""}${r.source.startsWith("JMPR") ? `<div class="bid">${esc(r.source)}</div>` : ""}</td>
      <td class="num">${usd(r.base_price)}</td>
      <td class="num">${(r.discount_bps / 100).toFixed(1)}%</td>
      <td class="num price">${usd(r.price)}</td>
      <td class="lines">${r.lines.map((l) => (l.includes("group") ? `<span class="group">${esc(l)}</span>` : esc(l))).join("<br>") || "none"}</td></tr>`).join("") +
    (cat.rows.length > 10 ? `<tr class="more"><td colspan="6">${cat.rows.length - 10} more agents bid higher</td></tr>` : "");
}

loadLive().then((l) => {
  const el = document.getElementById("liveline");
  el.innerHTML = `${esc(liveBanner(l))} <a href="receipts.html">every purchase</a>`;
  if (!l) return;
  el.classList.toggle("on", l.source === "live");
  ONCHAIN = new Set(l.data.merchants.filter((m) => m.approved).map((m) => m.account));
  if (CURRENT) bids(...CURRENT);
});
(async () => {
  const board = await load("board.json");
  BOARD = board;
  const live = await load("out/live-run.json");
  if (!board) { document.getElementById("buyer").textContent = "board.json not found. run make swarm"; return; }
  const pitches = live?.pitches ?? {};
  const tabs = document.getElementById("tabs");
  if (location.hash.startsWith("#tab-")) board.disclosure = { category: decodeURIComponent(location.hash.slice(5)) };
  board.categories.forEach((c, i) => {
    const b = document.createElement("button");
    b.textContent = c.category;
    b.onclick = () => { [...tabs.children].forEach((x) => x.classList.remove("on")); b.classList.add("on"); bids(c, pitches); };
    if (i === 0) b.classList.add("on");
    tabs.appendChild(b);
  });
  const b = board.buyer;
  document.getElementById("buyer").innerHTML = `
    <div class="slot"><b>no name, no history</b>merchants see a commitment<br>and the bits revealed for a discount</div>
    <div class="k">k=${b.cohort_k}<small>${esc(b.group_unlock)}: buyers in this cohort</small></div>
    <div class="counter" id="counter"></div>
    <div class="kv">commitment<br>${esc(b.verdict_commitment)}</div>`;
  const first = board.categories.find((c) => c.category === board.disclosure?.category) ?? board.categories[0];
  [...tabs.children].forEach((x) => x.classList.toggle("on", x.textContent === first.category));
  bids(first, pitches);

  document.getElementById("asks").innerHTML = (board.asks ?? []).map((a) => `<div class="ask">
      <div class="q">${esc(a.merchant.split(".")[0])}: "${esc(a.text)}"</div>
      <div class="a">${a.answer.answer === "declined" ? `declined: ${esc(a.answer.reason)}` : esc(a.answer.answer + " " + (a.answer.predicate ?? ""))}</div></div>`).join("") || `<div class="ask tag">no asks</div>`;
  document.getElementById("receipts").innerHTML = (board.receipts ?? []).map((r) => {
    const ok = r.outcome === "receipt";
    const bad = ok ? null : (r.detail.match(/^([Ff]\d+)/) || [])[0];
    return `<div class="receipt ${ok ? "ok" : "no"}">
      <div class="head"><span>${esc(r.label)}</span><span class="state">${ok ? "receipt" : "receipt refused"}</span></div>
      ${r.claims.map((c) => `<div class="claim ${bad && c.citations.some((x) => x.fact === bad) ? "bad" : ""}">${esc(c.line)} <span class="cite">[${esc(c.citations.map((x) => `${x.fact} ${x.field}=${x.value}`).join(", "))}]</span> ${esc(c.text)}</div>`).join("")}
      <div class="verdict">${ok ? `receipt ${esc(r.detail.slice(0, 16))}` : `${esc(r.detail.toLowerCase())}. receipt refused.`}</div>
    </div>`;
  }).join("");

  const rv = await load("reviews.json");
  document.getElementById("reviews").innerHTML = rv
    ? rv.merchants.map((m) => `<div class="ask"><div class="q">${esc(m.merchant.split(".")[0])}: ${m.members} buyers in the group, ${esc(m.status)}</div>` +
        (m.ratings ? `<div class="a" style="color:var(--fg)">score ${(m.score_x100 / 100).toFixed(2)} (mean ${(m.mean_x100 / 100).toFixed(2)}, ${m.delivered_pct}% delivered, ${m.ratings.length} ratings, no rater named)</div>` : `<div class="a">ratings stay sealed below k=${rv.k_min}</div>`) + `</div>`).join("") +
      `<div class="ask"><div class="q">refused</div><div class="a">${rv.refused.map((r) => esc(r.result.replace("refused: ", ""))).join("; ")}</div></div>`
    : "reviews.json not found. run make reviews";
  const sigs = live ? live.calls.filter((c) => c.signature_valid && c.request_hash_matches && c.response_hash_matches).length : 0;
  document.getElementById("foot").textContent =
    `${board.merchants} merchant agents. bids committed blind, then revealed. prices computed by code in the bazaar contract. ` +
    (live ? `near ai ${live.model}: ${sigs}/${live.calls.length} responses with a valid tee signature. ` : "") +
    `synthetic fixtures.`;
})();
</script>
</body>
</html>
