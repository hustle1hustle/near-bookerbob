# Jolt verifier for the standing proof, as a NEAR contract (measurement first).
# jolt-core is the pinned a16z/jolt 997c1543e, vendored in vendor/jolt with one change:
# the verifier stages are `pub` and the pre-stage transcript work is `verify_preamble`.
[package]
name = "bookerbob-jolt-onchain"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "jolt-onchain-native"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "audit"
path = "src/bin/audit.rs"
required-features = ["native"]

[features]
native = []

[dependencies]
jolt-core = { path = "vendor/jolt/jolt-core", default-features = false, features = ["minimal"] }
ark-serialize = { version = "0.5", features = ["derive"] }
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
dory = { package = "dory-pcs", path = "vendor/dory-pcs", features = ["backends"] }
tracer = { path = "vendor/jolt/tracer", default-features = false, features = ["std"] }

[build-dependencies]
miniz_oxide = "0.8"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
near-sdk = "=5.29.1"
getrandom = { version = "0.2", features = ["custom"] }
miniz_oxide = "0.8"
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }

[workspace]
exclude = ["vendor"]

[patch.crates-io]
dory-pcs = { path = "vendor/dory-pcs" }
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
allocative = { git = "https://github.com/facebookexperimental/allocative", rev = "85b773d85d526d068ce94724ff7a7b81203fc95e" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"
overflow-checks = true
