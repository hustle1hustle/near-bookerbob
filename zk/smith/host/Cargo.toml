[package]
name = "smith-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Native tool for smith programs: runs the request's vectors natively and in the guest, compiles, preprocesses, proves and verifies. The program list is generated by scripts/smith.mjs."

[features]
# Jolt's zk feature: the prover hides the witness, so the private input is hidden
# from the proof too. Built into its own target dir (scripts/smith.mjs prove-zk).
zk = ["jolt-sdk/zk"]

[dependencies]
jolt-sdk = { path = "../vendor/jolt/jolt-sdk", features = ["host"] }
bincode = { version = "2", features = ["serde"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
postcard = { version = "1", features = ["alloc"] }
# generated: one line per registered program
# @programs-begin
smith_coalition_k_of_n = { package = "smith-coalition-k-of-n", path = "../programs/coalition-k-of-n" }
smith_coalition_split = { package = "smith-coalition-split", path = "../programs/coalition-split" }
smith_spend_bucket = { package = "smith-spend-bucket", path = "../programs/spend-bucket" }
# @programs-end
