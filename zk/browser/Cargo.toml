# The browser prover for BookerBob's "decide" guest. Its own workspace and its own Jolt pin
# (a16z/jolt b4eb62480d76, fetched into vendor/jolt by build.sh); the four guests in zk/ stay
# on 997c1543efd4, the program hash registered on chain. Nothing here touches them.
[workspace]
members = ["public", "guest", "host"]
exclude = ["vendor", "prove-wasm", "verify-wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1

# The same patch tables upstream's own Cargo.toml carries at this pin (arkworks on a16z's
# branch, one jolt-field identity), plus the path copies the akita git source asks for.
[patch.crates-io]
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }

[patch."https://github.com/a16z/jolt"]
jolt-field = { path = "vendor/jolt/crates/jolt-field" }
jolt-poly = { path = "vendor/jolt/crates/jolt-poly" }
jolt-inlines-blake2 = { path = "vendor/jolt/jolt-inlines/blake2" }
jolt-inlines-ntt = { path = "vendor/jolt/jolt-inlines/ntt" }
jolt-inlines-keccak256 = { path = "vendor/jolt/jolt-inlines/keccak256" }
