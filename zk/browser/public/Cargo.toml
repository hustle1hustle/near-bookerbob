[package]
name = "decide-public"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The public statement of a decide proof: public.json, and the exact bytes the guest reads and writes."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.0.8", default-features = false, features = ["use-std"] }
