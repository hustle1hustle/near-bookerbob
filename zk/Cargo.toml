# Jolt zkVM provers for BookerBob (own workspace; not in `make test`, builds are large).
# Jolt is upstream a16z/jolt pinned to 997c1543e (2026-03-24), the commit the installed
# `jolt` CLI was built from; the arkworks patches are the revisions upstream's own
# Cargo.lock uses at that commit (the branch is pinned to 76bb3a45 in zk/Cargo.lock).
[package]
name = "bookerbob-zk"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]
members = ["guests/standing", "guests/price", "guests/referee", "guests/cohort"]

[profile.release]
debug = 1
codegen-units = 1
lto = "fat"

[dependencies]
jolt-sdk = { git = "https://github.com/a16z/jolt", rev = "997c1543efd49eb193ca403bb7722fc4b2f8e65b", features = ["host"] }
standing-guest = { path = "./guests/standing" }
price-guest = { path = "./guests/price" }
referee-guest = { path = "./guests/referee" }
cohort-guest = { path = "./guests/cohort" }
bookerbob-zkcore = { path = "../zkcore" }
bookerbob-graph = { path = "../graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = "2.2"

[patch.crates-io]
# Exactly upstream jolt@997c1543e's patch section: arkworks on the same git source jolt-core
# depends on (branch dev/twist-shout), pinned to 76bb3a45 through Cargo.lock as upstream's
# own lock does. A rev = pin here would be a second source and link two arkworks copies.
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
allocative = { git = "https://github.com/facebookexperimental/allocative", rev = "85b773d85d526d068ce94724ff7a7b81203fc95e" }
