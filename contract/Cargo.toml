[package]
name = "bookerbob-bazaar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "BookerBob bazaar contract: merchant registry, verdict store, nullifier spent-set, USDC escrow, settle"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
bookerbob-core = { path = "../core" }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
ed25519-dalek = "2.2"
p256 = { version = "0.13", features = ["ecdsa"] }
bookerbob-referee-worker = { path = "../worker" }
proptest = { workspace = true }

[features]
# Lets native tools (the CLI) run this contract against near-sdk's MockedBlockchain.
unit-testing = ["near-sdk/unit-testing"]

