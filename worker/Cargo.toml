[package]
name = "bookerbob-referee-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "BookerBob referee as an OutLayer worker: stdin JSON in, signed result (<= 900 bytes) out"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bookerbob-referee"
path = "src/main.rs"

[dependencies]
bookerbob-core = { path = "../core" }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "fast"] }
p256 = { version = "0.13", features = ["ecdsa"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = { version = "0.10", features = ["std"] }
ml-kem = { version = "0.3.4", default-features = false, features = ["alloc", "hazmat"] }
