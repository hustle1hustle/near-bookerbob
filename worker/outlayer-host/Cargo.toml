# `make outlayer-local`: runs the OutLayer referee component (worker/outlayer) in wasmtime with
# a MOCK of OutLayer's host interfaces, then gives its signed results to the real bazaar contract
# code on near-sdk's MockedBlockchain. A crate of its own, outside the workspace: wasmtime is a
# large dependency no other part of the repo needs. Nothing here talks to OutLayer or a chain.
[package]
name = "bookerbob-outlayer-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
# The runtime major OutLayer's worker uses (fastnear/near-outlayer worker/Cargo.toml at e954d4a).
wasmtime = { version = "36", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "36", default-features = false }
anyhow = "1"
bookerbob-core = { path = "../../core" }
bookerbob-referee-worker = { path = ".." }
bookerbob-bazaar = { path = "../../contract", features = ["unit-testing"] }
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
serde_json = "1"
hex = "0.4"
ed25519-dalek = "2.2"
hmac = "0.12"
sha2 = "0.10"
