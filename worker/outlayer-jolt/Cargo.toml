# Jolt verification inside OutLayer's TEE: a wasm32-wasip2 component that verifies a Jolt proof
# against one of the programs pinned in `programs/` (file name = sha256 of the serialized verifier
# preprocessing = the program hash) and signs the verdict with the project's host key. Its own
# crate and lock, outside the workspace and outside zk/ (zk/rust-toolchain.toml pins 1.94 without
# wasm32-wasip2). Jolt is a16z/jolt 997c1543, the pin of the standing guest in zk/, verifier only
# (jolt-core's `minimal` feature).
[package]
name = "bookerbob-jolt-verify-outlayer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "bookerbob-jolt-verify-outlayer"
path = "src/main.rs"

[dependencies]
jolt-core = { git = "https://github.com/a16z/jolt", rev = "997c1543efd49eb193ca403bb7722fc4b2f8e65b", default-features = false, features = ["minimal"] }
common = { git = "https://github.com/a16z/jolt", rev = "997c1543efd49eb193ca403bb7722fc4b2f8e65b" }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.36"

[patch.crates-io]
ark-bn254 = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ff = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-ec = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
ark-serialize = { git = "https://github.com/a16z/arkworks-algebra", branch = "dev/twist-shout" }
allocative = { git = "https://github.com/facebookexperimental/allocative", rev = "85b773d85d526d068ce94724ff7a7b81203fc95e" }

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"
