[package]
name = "bookerbob-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "BookerBob CLI: offline end-to-end check on fixtures, fixture generator"

[[bin]]
name = "bookerbob"
path = "src/main.rs"

[dependencies]
bookerbob-core = { path = "../core" }
bookerbob-bazaar = { path = "../contract", features = ["unit-testing"] }
bookerbob-referee-worker = { path = "../worker" }
near-sdk = { workspace = true, features = ["unit-testing"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
ed25519-dalek = "2.2"
p256 = { version = "0.13", features = ["ecdsa"] }
# NEAR AI verdict check (bookerbob near-ai): TDX quote, E2EE v2 open.
dcap-qvl = { version = "0.3.12", default-features = false, features = ["std", "rustcrypto"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
curve25519-dalek = "4"
